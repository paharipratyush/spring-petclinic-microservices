# reusable/ecr-build-push.yml
#
# Reusable workflow: build one Spring Petclinic service for ARM64,
# scan with Trivy (CRITICAL CVEs gate the push — HIGH is informational),
# then push to ECR dev.
#
# Called by build-push.yml via a matrix strategy.

name: Build, Scan, Push (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Service name (e.g. customers-service)"
        required: true
        type: string
      sha:
        description: "7-character commit SHA used as the image tag"
        required: true
        type: string
      aws-region:
        description: "AWS region where ECR repositories are hosted"
        required: false
        type: string
        default: "eu-central-1"
      aws-account-id:
        description: "AWS account ID for ECR registry URL construction"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: ${{ inputs.service }}
    runs-on: ubuntu-latest

    env:
      # Maven builds images with the springcommunity/ prefix — see docker/Dockerfile
      MAVEN_MODULE: spring-petclinic-${{ inputs.service }}
      SOURCE_IMAGE: springcommunity/spring-petclinic-${{ inputs.service }}
      TARGET_IMAGE: ${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/petclinic-dev/${{ inputs.service }}:${{ inputs.sha }}

    steps:
      - name: Checkout application repo
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # ARM64 cross-compilation on x86 GitHub Actions runners requires QEMU emulation.
      # Build time increases from ~2 min to ~5 min per image — acceptable for a learning project.
      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ inputs.aws-region }}

      - name: Build Docker image (ARM64) with Maven
        run: |
          ./mvnw clean install \
            -P buildDocker \
            -Dcontainer.platform="linux/arm64" \
            -pl "${{ env.MAVEN_MODULE }}" -am \
            --no-transfer-progress \
            --batch-mode

      # Scan for CRITICAL CVEs before pushing. exit-code "1" fails the job and
      # blocks the push — this is the security gate. ignore-unfixed skips CVEs
      # with no available patch (reduces noise from unfixable base-image issues).
      # Add accepted CVE IDs to .trivyignore at the repo root to allowlist them.
      - name: Trivy scan — CRITICAL (gate)
        id: trivy-critical
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: table
          output: trivy-critical-${{ inputs.service }}.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignore: .trivyignore

      # HIGH CVEs are informational — they generate a report but do not block the push.
      - name: Trivy scan — HIGH (informational)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: table
          output: trivy-high-${{ inputs.service }}.txt
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH
          trivyignore: .trivyignore

      # Upload scan results as artifacts regardless of outcome so developers can
      # review CVE reports even when the build fails on a CRITICAL finding.
      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ inputs.service }}-${{ inputs.sha }}
          path: |
            trivy-critical-${{ inputs.service }}.txt
            trivy-high-${{ inputs.service }}.txt
          if-no-files-found: warn
          retention-days: 30

      # These steps only run if the CRITICAL scan passed (no if: always()).
      - name: Tag image for ECR
        run: |
          docker tag "${{ env.SOURCE_IMAGE }}" "${{ env.TARGET_IMAGE }}"
          echo "Tagged: ${{ env.SOURCE_IMAGE }} → ${{ env.TARGET_IMAGE }}"

      - name: Push image to ECR
        run: |
          docker push "${{ env.TARGET_IMAGE }}"
          echo "Pushed: ${{ env.TARGET_IMAGE }}"

      - name: Logout from ECR
        if: always()
        run: |
          docker logout \
            "${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com"
