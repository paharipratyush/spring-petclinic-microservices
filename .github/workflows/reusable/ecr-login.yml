# Reusable workflow: configure AWS OIDC credentials and log in to ECR.
# Called by build-push.yml and ecr-build-push.yml to avoid duplicate auth steps.

name: ECR Login (Reusable)

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS region where ECR repositories are hosted"
        required: false
        type: string
        default: "eu-central-1"
    outputs:
      registry:
        description: "ECR registry base URL (account.dkr.ecr.region.amazonaws.com)"
        value: ${{ jobs.login.outputs.registry }}
    secrets:
      AWS_ROLE_ARN:
        required: true
        description: "IAM role ARN for OIDC federation (GitHub Actions)"

permissions:
  id-token: write
  contents: read

jobs:
  login:
    name: Configure AWS + ECR login
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ inputs.aws-region }}
