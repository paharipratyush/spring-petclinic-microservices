# reusable/ecr-login.yml
#
# Reusable workflow: authenticate to AWS via OIDC and log in to Amazon ECR.
# Returns the registry URL as an output.
#
# Use this when a workflow needs ECR access without a full build — for example,
# a manual image push script or a future ad-hoc deployment workflow.
#
# Example call:
#
#   jobs:
#     push:
#       uses: ./.github/workflows/reusable/ecr-login.yml
#       with:
#         aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}
#       secrets:
#         AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

name: ECR Login (reusable)

on:
  workflow_call:
    inputs:
      aws-region:
        description: "AWS region where ECR is hosted"
        required: false
        type: string
        default: "eu-central-1"
      aws-account-id:
        description: "AWS account ID for ECR registry URL"
        required: true
        type: string
    outputs:
      registry:
        description: "ECR registry URL ({account}.dkr.ecr.{region}.amazonaws.com)"
        value: ${{ jobs.login.outputs.registry }}
    secrets:
      AWS_ROLE_ARN:
        required: true
        description: "OIDC IAM role ARN to assume (from petclinic-github-actions-role Terraform output)"

permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.ecr-login.outputs.registry }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ inputs.aws-region }}
