# build-push.yml
#
# CI pipeline for Spring Petclinic Microservices.
# Triggered on push to main. Detects which of the 8 service directories changed,
# builds ARM64 Docker images for changed services only, scans with Trivy
# (CRITICAL CVEs fail the build -- the scan gates the push), pushes to ECR dev,
# then dispatches an event to the platform repo so update-image-tags.yml can
# commit the new tag to helm-values/ and ArgoCD picks up the change.
#
# Prerequisites -- GitHub Secrets:
#   AWS_ROLE_ARN        -- OIDC IAM role ARN (terraform output github_actions_role_arn)
#   PLATFORM_REPO_TOKEN -- GitHub PAT with contents:write on the platform repo
#   AWS_REGION          -- eu-central-1
#   AWS_ACCOUNT_ID      -- your 12-digit AWS account ID

name: CI - Build and Push

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_rebuild_all:
        description: "Rebuild all 8 services regardless of file changes (use after ECR wipe)"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  id-token: write
  contents: read

jobs:
  # ---- Job 1: Detect which service directories changed ----------------------
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix:      ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
      services:    ${{ steps.build-matrix.outputs.services }}
      sha:         ${{ steps.build-matrix.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed service directories
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            config-server:
              - 'spring-petclinic-config-server/**'
            discovery-server:
              - 'spring-petclinic-discovery-server/**'
            api-gateway:
              - 'spring-petclinic-api-gateway/**'
            customers-service:
              - 'spring-petclinic-customers-service/**'
            visits-service:
              - 'spring-petclinic-visits-service/**'
            vets-service:
              - 'spring-petclinic-vets-service/**'
            genai-service:
              - 'spring-petclinic-genai-service/**'
            admin-server:
              - 'spring-petclinic-admin-server/**'

      - name: Build service matrix from changed services
        id: build-matrix
        run: |
          # workflow_dispatch with force_rebuild_all=true (or any manual trigger):
          # build all 8 services regardless of file changes. This is the standard
          # way to repopulate ECR after a destroy/rebuild cycle.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.force_rebuild_all }}" = "true" ]; then
            echo "Force rebuild all — triggered manually."
            services=(config-server discovery-server api-gateway customers-service \
                      visits-service vets-service genai-service admin-server)
          else
            services=()
            [ "${{ steps.filter.outputs.config-server }}"     = "true" ] && services+=("config-server")
            [ "${{ steps.filter.outputs.discovery-server }}"  = "true" ] && services+=("discovery-server")
            [ "${{ steps.filter.outputs.api-gateway }}"       = "true" ] && services+=("api-gateway")
            [ "${{ steps.filter.outputs.customers-service }}" = "true" ] && services+=("customers-service")
            [ "${{ steps.filter.outputs.visits-service }}"    = "true" ] && services+=("visits-service")
            [ "${{ steps.filter.outputs.vets-service }}"      = "true" ] && services+=("vets-service")
            [ "${{ steps.filter.outputs.genai-service }}"     = "true" ] && services+=("genai-service")
            [ "${{ steps.filter.outputs.admin-server }}"      = "true" ] && services+=("admin-server")
          fi

          SHA="${GITHUB_SHA::7}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          if [ ${#services[@]} -eq 0 ]; then
            echo "No service directories changed -- skipping build."
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]"        >> $GITHUB_OUTPUT
            echo "services="        >> $GITHUB_OUTPUT
          else
            MATRIX=$(printf '"%s"\n' "${services[@]}" | jq -sc .)
            echo "matrix=${MATRIX}"        >> $GITHUB_OUTPUT
            echo "has-changes=true"        >> $GITHUB_OUTPUT
            echo "services=${services[*]}" >> $GITHUB_OUTPUT
            echo "Changed services (${#services[@]}): ${services[*]}"
          fi

  # ---- Job 2: Build, scan, push (one matrix entry per changed service) ------
  # Each service runs in parallel. fail-fast: false lets one failure not cancel
  # the other services. CRITICAL Trivy findings gate the push -- no CRITICAL
  # CVEs means no push for that service.
  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
      fail-fast: false
    env:
      MAVEN_MODULE: spring-petclinic-${{ matrix.service }}
      SOURCE_IMAGE: springcommunity/spring-petclinic-${{ matrix.service }}
      TARGET_IMAGE: >-
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/petclinic-dev/${{ matrix.service }}:${{ needs.detect-changes.outputs.sha }}
      TARGET_IMAGE_PROD: >-
        ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/petclinic-prod/${{ matrix.service }}:${{ needs.detect-changes.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          region: ${{ secrets.AWS_REGION }}

      - name: Pull latest base image (ensure patched layers)
        run: docker pull --platform linux/arm64 eclipse-temurin:17

      - name: Build Docker image (ARM64) with Maven
        run: |
          ./mvnw clean install \
            -P buildDocker \
            -Dcontainer.platform="linux/arm64" \
            -pl "${{ env.MAVEN_MODULE }}" -am \
            --no-transfer-progress \
            --batch-mode

      - name: Trivy scan - CRITICAL (gate)
        id: trivy-critical
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: table
          output: trivy-critical-${{ matrix.service }}.txt
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore

      - name: Print CRITICAL scan results
        if: always()
        run: |
          echo "=== Trivy CRITICAL results for ${{ matrix.service }} ==="
          cat trivy-critical-${{ matrix.service }}.txt || echo "(no output file)"

      - name: Trivy scan - HIGH (informational)
        if: always()
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.SOURCE_IMAGE }}
          format: table
          output: trivy-high-${{ matrix.service }}.txt
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH
          trivyignores: .trivyignore

      - name: Upload Trivy scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-${{ needs.detect-changes.outputs.sha }}
          path: |
            trivy-critical-${{ matrix.service }}.txt
            trivy-high-${{ matrix.service }}.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Tag image for dev ECR
        run: docker tag "${{ env.SOURCE_IMAGE }}" "${{ env.TARGET_IMAGE }}"

      - name: Tag image for prod ECR
        run: docker tag "${{ env.SOURCE_IMAGE }}" "${{ env.TARGET_IMAGE_PROD }}"

      - name: Push image to dev ECR
        run: docker push "${{ env.TARGET_IMAGE }}"

      - name: Push image to prod ECR
        run: |
          # Prod ECR repos only exist when prod infra is provisioned.
          # Skip gracefully if they do not exist (e.g. after prod destroy).
          if aws ecr describe-repositories \
            --repository-names "petclinic-prod/${{ matrix.service }}" \
            --region "${{ secrets.AWS_REGION }}" > /dev/null 2>&1; then
            docker push "${{ env.TARGET_IMAGE_PROD }}"
            echo "Pushed to prod ECR: ${{ env.TARGET_IMAGE_PROD }}"
          else
            echo "Prod ECR repo petclinic-prod/${{ matrix.service }} does not exist — skipping."
            echo "Re-run CI after prod infrastructure is provisioned to populate prod ECR."
          fi

      - name: Logout from ECR
        if: always()
        run: >-
          docker logout
          "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"

  # ---- Job 3: Notify platform repo ------------------------------------------
  # Fires only when ALL matrix build jobs succeeded. The repository_dispatch
  # event triggers update-image-tags.yml in the platform repo which commits the
  # new image tag to helm-values/{service}.yaml. ArgoCD detects the commit and
  # deploys (dev: auto-sync, prod: manual approval).
  notify:
    name: Notify platform repo
    needs: [detect-changes, build]
    if: always() && needs.detect-changes.outputs.has-changes == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch app-image-built to platform repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          repository: paharipratyush/petclinic-platform
          event-type: app-image-built
          client-payload: '{"sha":"${{ needs.detect-changes.outputs.sha }}","services":"${{ needs.detect-changes.outputs.services }}"}'
